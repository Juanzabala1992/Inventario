server:
  port: ${SERVER_PORT:8082}

service:
  api-key: ${SERVICE_API_KEY:local-dev-key}

products-service:
  url: ${PRODUCTS_SERVICE_URL:http://localhost:8081}
  api-key: ${PRODUCTS_SERVICE_API_KEY:${SERVICE_API_KEY:local-dev-key}}
  timeout-ms: ${PRODUCTS_SERVICE_TIMEOUT_MS:900}
  retries: ${PRODUCTS_SERVICE_RETRIES:2}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/inventory-db}
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health

