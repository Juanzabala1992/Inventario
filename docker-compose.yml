services:
  products-service:
    build:
      context: .
      dockerfile: backend/products-service/Dockerfile
    environment:
      SERVER_PORT: 8081
      SERVICE_API_KEY: ${SERVICE_API_KEY:-local-dev-key}
      SPRING_DATASOURCE_URL: jdbc:h2:file:/app/data/products-db
    ports:
      - "8081:8081"
    volumes:
      - products-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  inventory-service:
    build:
      context: .
      dockerfile: backend/inventory-service/Dockerfile
    depends_on:
      products-service:
        condition: service_healthy
    environment:
      SERVER_PORT: 8082
      SERVICE_API_KEY: ${SERVICE_API_KEY:-local-dev-key}
      PRODUCTS_SERVICE_URL: http://products-service:8081
      PRODUCTS_SERVICE_API_KEY: ${SERVICE_API_KEY:-local-dev-key}
      PRODUCTS_SERVICE_TIMEOUT_MS: 900
      PRODUCTS_SERVICE_RETRIES: 2
      SPRING_DATASOURCE_URL: jdbc:h2:file:/app/data/inventory-db
    ports:
      - "8082:8082"
    volumes:
      - inventory-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      products-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  products-data:
  inventory-data:

